version: '3'
services:
  graph-node:
    image: graphprotocol/graph-node
    command:
      - /bin/sh
      - -lc
      - >-
        exec graph-node
        --node-id default
        --ipfs ipfs:5001
    volumes:
      - ./config.toml:/config/config.toml:ro
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8020:8020'
      - '8030:8030'
      - '8040:8040'
    depends_on:
      - ipfs
      - postgres
    environment:
      GRAPH_LOG: info
      GRAPH_NODE_CONFIG: /config/config.toml
      # RPC URLs — used by config.toml for env-var substitution
      KAVA_RPC_URL: ${KAVA_RPC_URL:-https://lb.nodies.app/v1/9e49c973e9d546a48adbd48915c70f1d}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-https://arb1.arbitrum.io/rpc}
      # Performance tuning — batch sizes (global fallbacks)
      GRAPH_ETHEREUM_BLOCK_BATCH_SIZE: '2000'
      GRAPH_ETHEREUM_MAX_BLOCK_RANGE_SIZE: '100000'
      GRAPH_ETHEREUM_TARGET_TRIGGERS_PER_BLOCK_RANGE: '2000'
      GRAPH_ALLOW_NON_DETERMINISTIC_IPFS: 'true'
      GRAPH_ETHEREUM_CLEANUP_BLOCKS: 'true'
      GRAPH_ETHEREUM_GENESIS_BLOCK_NUMBER: '0'
  postgres:
    image: postgres:14-alpine
    ports:
      - '${SCRUB_GRAPHS_POSTGRES_HOST_PORT:-5433}:5432'
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  ipfs:
    image: ipfs/go-ipfs:v0.4.23
    ports:
      - '5001:5001'
    volumes:
      - ./data/ipfs:/data/ipfs
