version: '3'
services:
  graph-node:
    image: graphprotocol/graph-node
    command:
      - /bin/sh
      - -lc
      - >-
        unset GRAPH_NODE_CONFIG &&
        exec graph-node
        --node-id default
        --postgres-url postgresql://graph-node:let-me-in@postgres:5432/graph-node?sslmode=prefer
        --ethereum-rpc kava:${KAVA_RPC_URL:-https://lb.nodies.app/v1/9e49c973e9d546a48adbd48915c70f1d}
        --ethereum-rpc hardhat:${HARDHAT_RPC_URL:-http://host.docker.internal:8545}
        --ethereum-rpc arbitrum-one:${ARBITRUM_RPC_URL:-https://rpc.ankr.com/arbitrum/83644317debe3155dccb0f8a54aa4aa8cc996442196cf06808479567ca433b03}
        --ipfs ipfs:5001
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8020:8020'
      - '8030:8030'
      - '8040:8040'
    depends_on:
      - ipfs
      - postgres
    environment:
      GRAPH_LOG: info
      # Performance tuning - aggressive catch-up batch sizes
      GRAPH_ETHEREUM_BLOCK_BATCH_SIZE: '2000'
      GRAPH_ETHEREUM_MAX_BLOCK_RANGE_SIZE: '100000'
      GRAPH_ETHEREUM_TARGET_TRIGGERS_PER_BLOCK_RANGE: '2000'
      GRAPH_ALLOW_NON_DETERMINISTIC_IPFS: 'true'
      # Poll every 10s while catching up
      GRAPH_ETHEREUM_POLLING_INTERVAL: '10000'
      GRAPH_ETHEREUM_CLEANUP_BLOCKS: 'true'
      GRAPH_ETHEREUM_GENESIS_BLOCK_NUMBER: '0'
  postgres:
    image: postgres:14-alpine
    ports:
      - '${SCRUB_GRAPHS_POSTGRES_HOST_PORT:-5433}:5432'
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  ipfs:
    image: ipfs/go-ipfs:v0.4.23
    ports:
      - '5001:5001'
    volumes:
      - ./data/ipfs:/data/ipfs
